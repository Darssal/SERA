<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="SERA 序日，结合可用时间规划目标，安排任务与日程，记录专注进展。">
  <meta name="theme-color" content="#176B59">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="SERA 序日">
  <link rel="icon" type="image/svg+xml" href="sera-icon.svg">
  <link rel="manifest" href="manifest.json">
  <title>SERA · 序日</title>
  <script src="sera-platform.js"></script>
  <style>html,body{margin:0;background:#F7F8FA}#loading{position:fixed;inset:0;display:grid;place-content:center;text-align:center;font:15px sans-serif;color:#176B59}#loading svg{width:58px;height:58px;margin:0 auto 18px}</style>
</head>
<body>
  <div id="loading" role="status"><img src="sera-icon.svg" width="58" height="58" alt="" style="margin:0 auto 18px">SERA 正在打开你的安排…</div>
  <script>window.addEventListener('flutter-first-frame',()=>document.getElementById('loading')?.remove());</script>
  <script>
    // Populate the complete local runtime before its first request, including
    // the first visit where Service Worker control previously arrived too late.
    window.seraOfflineReady = (async () => {
      try { await window.seraPlatform.prepareOfflineShell(); }
      catch (_) {
        const notice = document.createElement('div');
        notice.id = 'offline-cache-status';
        notice.setAttribute('role', 'status');
        notice.style.cssText = 'position:fixed;bottom:12px;left:16px;right:16px;z-index:9999;padding:12px;background:#fff5db;color:#765016;border-radius:12px;font:13px sans-serif';
        notice.textContent = navigator.onLine ? '离线资源暂未准备完成，当前可在线继续。网络恢复后刷新重试。' : '离线运行资源不可用，请联网后刷新重试。';
        const retry = document.createElement('button');retry.textContent = '重新打开';retry.onclick = () => location.reload();
        notice.appendChild(retry);document.body.appendChild(notice);
        console.warn('SERA offline resources are not ready; online startup will continue.');
      }
      const script = document.createElement('script');script.src = 'flutter_bootstrap.js';script.async = true;document.body.appendChild(script);
    })();
  </script>
</body>
</html>
