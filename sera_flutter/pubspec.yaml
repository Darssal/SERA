name: sera_flutter
description: SERA 智能日程与目标管理 Android / Web 应用
publish_to: none
version: 2.2.1+33
environment:
  sdk: ^3.13.2
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.5+1
  go_router: ^18.1.2
  dio: ^5.11.1
  shared_preferences: ^2.5.6
  sembast: ^3.8.5
  sembast_web: ^2.4.6
  path_provider: ^2.1.5
  flutter_secure_storage: ^10.0.0
  web_socket_channel: ^3.0.3
  timezone: ^0.11.0
  crypto: ^3.0.8
  flutter_svg: ^2.3.2
  image_picker: 1.2.4
  flutter_staggered_grid_view: 0.7.0
dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  shared_preferences_platform_interface: ^2.4.2
flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/brand/brand-sera-mark@3x.png
  fonts:
    - family: SeraSans
      fonts:
        - asset: assets/fonts/sera-noto-sans-sc.ttf
